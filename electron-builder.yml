appId: io.github.daikazu.crimsonatlas
productName: Crimson Atlas
directories:
  output: release
files:
  - dist/**
  # Map data belongs to MapGenie and is downloaded by the app on first launch, never shipped.
  - '!dist/data/**'
  - dist-electron/**
  - package.json
mac:
  category: public.app-category.games
  # Artwork inset to Apple's icon grid so it matches other Dock icons; Windows uses it edge to edge.
  icon: build/icon-mac.png
  # Ad-hoc signature: without one, a downloaded copy is reported as "damaged" on Apple silicon.
  identity: '-'
  # The hardened runtime only matters for notarization, and blocks an ad-hoc signed app from loading its own frameworks.
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish: null
