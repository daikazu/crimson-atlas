appId: io.github.daikazu.crimsonatlas
productName: Crimson Atlas
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
mac:
  category: public.app-category.games
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish: null
